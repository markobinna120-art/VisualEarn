<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualearn - Earn by Tasks</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("eOnK3qvUFiw89dhdV")</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7ff}
.header{background:linear-gradient(135deg,#6a5af9,#4f46e5);color:#fff;padding:40px 20px;text-align:center}
.card{max-width:420px;margin:-25px auto 20px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 15px 40px rgba(79,70,229,.15)}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #e5e7eb;border-radius:12px;font-size:15px}
button{width:100%;padding:14px;background:#4f46e5;color:#fff;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{background:#a5b4fc}
</style>
</head>
<body>
<div class="header">
<h1 style="margin:0">Visualearn</h1>
<p>Do Tasks • Earn Money • Fast Withdrawal</p>
</div>
<div class="card" id="regCard">
<h2 style="margin-top:0">Create Account</h2>
<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email Address">
<input id="phone" placeholder="Phone Number">
<button id="sendBtn" onclick="sendOTP()">Send Verification Code</button>
<div id="otpArea" style="display:none">
<p style="font-size:13px;color:green">Code sent to your email from markobinna120@gmail.com</p>
<input id="otpInput" placeholder="Enter 6-digit code">
<input id="pass" type="password" placeholder="Create Password">
<button onclick="verifyOTP()">Verify & Join Visualearn</button>
</div>
<p style="font-size:12px;color:#6b7280;text-align:center;margin-top:15px">Admin: markobinna120@gmail.com<br>Web App Version</p>
</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
let generatedOTP="";
function sendOTP(){
 const name=document.getElementById('name').value.trim();
 const email=document.getElementById('email').value.trim();
 if(!name || !email.includes('@')){alert('Enter name and valid email');return}
 generatedOTP=Math.floor(100000+Math.random()*900000).toString();
 const btn=document.getElementById('sendBtn');
 btn.innerText="Sending code..."; btn.disabled=true;

 emailjs.send("service_147bn6m","template_kndbrqg",{
   to_email: email,
   to_name: name,
   otp_code: generatedOTP,
   from_name: "Visualearn",
   user_email: email,
   user_name: name
 }).then(()=>{
   alert("Code sent to "+email);
   document.getElementById('otpArea').style.display='block';
   btn.innerText="Code Sent ✓";
 }, (err)=>{
   console.log(err);
   alert("Email failed, but demo code is: "+generatedOTP+" - Check your EmailJS template allows to_email");
   document.getElementById('otpArea').style.display='block';
   btn.disabled=false;
   btn.innerText="Resend Code";
 });
}

function verifyOTP(){
 const entered=document.getElementById('otpInput').value.trim();
 if(entered===generatedOTP){
   localStorage.setItem('visualearn_user',document.getElementById('name').value);
   localStorage.setItem('visualearn_email',document.getElementById('email').value);
   alert("Welcome to Visualearn!");
   window.location.href="dashboard.html";
 } else {
   alert("Wrong code. Your code is "+generatedOTP+" (demo)");
 }
}
</script>
</body>
 </html>

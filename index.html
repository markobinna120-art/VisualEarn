<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualearn - Earn by Tasks</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7ff}
.header{background:linear-gradient(135deg,#6a5af9,#4f46e5);color:#fff;padding:40px 20px;text-align:center}
.card{max-width:420px;margin:-25px auto 20px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 15px 40px rgba(79,70,229,.15)}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #e5e7eb;border-radius:12px;font-size:15px}
button{width:100%;padding:14px;background:#4f46e5;color:#fff;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.task{background:#fff;margin:12px;padding:16px;border-radius:14px;display:flex;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.badge{background:#eef2ff;color:#4f46e5;padding:4px 10px;border-radius:20px;font-size:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("YOUR_PUBLIC_KEY")</script>
</head>
<body>
<div class="header">
<h1 style="margin:0">Visualearn</h1>
<p>Do Tasks • Earn Money • Fast Withdrawal</p>
</div>
<div class="card" id="regCard">
<h2 style="margin-top:0">Create Account</h2>
<input id="name" placeholder="Full Name">
<input id="email" type="email" placeholder="Email Address">
<input id="phone" placeholder="Phone Number">
<button id="sendBtn" onclick="sendOTP()">Send Code to Email</button>
<div id="otpArea" style="display:none">
<input id="otpInput" placeholder="Enter 6-digit code">
<input id="pass" type="password" placeholder="Create Password">
<button onclick="verifyOTP()">Verify & Join Visualearn</button>
</div>
<p style="font-size:12px;color:#6b7280;text-align:center">Admin: markobinna120@gmail.com<br>Secure Email Verification</p>
</div>

<script>
let generatedOTP="";
function sendOTP(){
 const name=document.getElementById('name').value;
 const email=document.getElementById('email').value;
 if(!email.includes('@')){alert('Enter valid email');return}
 generatedOTP=Math.floor(100000+Math.random()*900000).toString();
 document.getElementById('sendBtn').innerText="Sending...";

 // SEND VIA EMAILJS - Replace with your keys
 emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
   to_email: email,
   to_name: name,
   otp_code: generatedOTP,
   from_name: "Visualearn",
   admin_email: "markobinna120@gmail.com"
 }).then(()=>{ 
   alert("Code sent to "+email+" from markobinna120@gmail.com");
   document.getElementById('otpArea').style.display='block';
   document.getElementById('sendBtn').innerText="Code Sent";
 }).catch(()=>{
   // Fallback demo if EmailJS not set yet
   alert("DEMO MODE: Your code is "+generatedOTP+" (Set up EmailJS to send real email)");
   document.getElementById('otpArea').style.display='block';
 });
}

function verifyOTP(){
 if(document.getElementById('otpInput').value===generatedOTP){
   localStorage.setItem('visualearn_user',document.getElementById('name').value);
   window.location.href="dashboard.html";
 } else alert("Invalid code. Try again.");
}
</script>
</body>
</html>
